name: 🚀 Build RashtraNiti APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Java 17
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Download gradle-wrapper.jar (needed for ./gradlew)
      - name: 📦 Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/
          chmod +x gradlew

      # Step 4: Cache Gradle
      - name: 🗃️ Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 5: Show Android SDK info (pre-installed on ubuntu-latest)
      - name: 📱 Show Android SDK info
        run: |
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME = $ANDROID_HOME"
          ls $ANDROID_SDK_ROOT/platforms/ || true

      # Step 6: Accept Android SDK licenses
      - name: ✅ Accept Android SDK Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Step 7: Build Debug APK
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # Step 8: Upload APK
      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RashtraNiti-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Step 9: Show result
      - name: ✅ Build Complete
        if: success()
        run: |
          echo "============================================"
          echo "  ✅ RashtraNiti APK Build Successful!"
          echo "============================================"
          ls -lh app/build/outputs/apk/debug/*.apk
