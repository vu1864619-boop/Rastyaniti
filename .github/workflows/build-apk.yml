name: 🚀 Build RashtraNiti 3D Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build 3D Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🗃️ Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📱 Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build_error.log

      - name: 📤 Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: build_error.log

      - name: 📤 Upload RashtraNiti 3D APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RashtraNiti-3D-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📜 Output APK Info
        if: success()
        run: |
          echo "============================================="
          echo "  ✅ RashtraNiti 3D APK Generated Successfully!"
          echo "============================================="
          ls -lh android/app/build/outputs/apk/debug/*.apk
