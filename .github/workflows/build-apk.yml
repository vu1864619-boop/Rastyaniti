name: 🚀 Build RashtraNiti 3D Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build 3D Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Capacitor Dependencies
        run: |
          npm install --production=false

      - name: 🗃️ Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📱 Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build.log 2>&1 || (cat ../build.log && exit 1)

      - name: 📄 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Execution-Log
          path: build.log

      - name: 📦 Publish RashtraNiti 3D APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RashtraNiti-3D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
